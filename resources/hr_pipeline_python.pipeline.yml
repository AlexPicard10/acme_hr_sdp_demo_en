resources:
  pipelines:
    # SDP pipeline written in Python (same logic as SQL) → schema acme_hr_en_python
    hr_pipeline_python:
      name: HR_360_Python_${bundle.target}
      # These values are readable from Python code via spark.conf.get("name").
      configuration:
        "master_data_schema": ${var.master_data_schema}
        "employees_path_fr": ${var.employees_path_fr}
        "employees_path_be": ${var.employees_path_be}
        "absences_path_fr": ${var.absences_path_fr}
        "absences_path_be": ${var.absences_path_be}
      libraries:
        - glob:
            include: ../src/01-HR_SDP_Python/00-Data-Sources/**
        - glob:
            include: ../src/01-HR_SDP_Python/01-Employees/**
        - glob:
            include: ../src/01-HR_SDP_Python/02-Absences/**
      catalog: ${var.catalog}
      schema: ${var.schema_python}
      channel: CURRENT
      development: ${var.dlt_development_mode}
      photon: true
      serverless: true
      root_path: ../src/01-HR_SDP_Python
